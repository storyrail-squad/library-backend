name: Backend CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build, unit tests, JaCoCo, SpotBugs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: pom.xml

      # verify = unit tests + JaCoCo report and 80 % line gate + SpotBugs/FindSecBugs check
      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-jar
          path: target/library-backend.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # Acceptance tests live in storyrail-squad/library-api-tests (Cucumber + Java). Isolated run: the jar built above.
  api-tests:
    name: API acceptance (Cucumber, isolated)
    needs: build
    uses: storyrail-squad/library-api-tests/.github/workflows/run-suite.yml@main # zizmor: ignore[unpinned-uses] same-org test suite, always latest
    with:
      base-url: http://localhost:8080
      jar-artifact: backend-jar
      report-name: api-acceptance-isolated

  docker:
    name: Docker image + Trivy, then push to GHCR
    needs: api-tests
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      # Digest-pinned reference of the exact image Trivy scanned; deploy-render deploys this.
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/library-api
          tags: |
            type=sha
            type=raw,value=latest

      # Build into the local Docker daemon only. Nothing is pushed until Trivy has passed.
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned by commit SHA (v0.35.0): trivy-action tags were hijacked in March 2026.
      # Note that `@0.28.0` does not exist; that release is tagged `v0.28.0`.
      - name: Trivy scan of the local image (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Without this, format: sarif drops the severity filter and any fixable LOW/MEDIUM fails the gate.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-library-api

      # Surface each finding as an annotation so the cause is readable without downloading logs.
      - name: List Trivy findings
        if: ${{ failure() && hashFiles('trivy-results.sarif') != '' }}
        run: |
          jq -r '.runs[].results[] | "::error title=Trivy \(.ruleId)::\(.message.text | split("\n") | map(select(test("^(Package|Installed Version|Fixed Version|Severity):"))) | join(" | "))"' trivy-results.sarif | head -n 40

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the very image that was scanned (no rebuild), then record its registry digest.
      - name: Push scanned image
        id: push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SCANNED: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then docker push "$tag"; fi
          done <<< "$IMAGE_TAGS"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$SCANNED")
          echo "Pushed $ref"
          echo "image=$ref" >> "$GITHUB_OUTPUT"

  deploy-render:
    name: Deploy to Render
    needs: docker
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: render
      url: ${{ vars.BACKEND_URL }}
    outputs:
      # The QA URL when this run deployed and verified the backend; empty otherwise.
      qa-url: ${{ steps.deployed.outputs.url }}
    env:
      # Secrets can't be used in a job-level `if`, so each step is gated on this env var.
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      # The Trivy-scanned GHCR image, pinned by digest (render.yaml declares an image-backed service).
      IMAGE: ${{ needs.docker.outputs.image }}
    steps:
      - name: Skip notice
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not set; skipping Render deploy."

      - name: Trigger Render deploy hook with the scanned image
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          test -n "$IMAGE" || { echo "::error::docker job did not report an image digest"; exit 1; }
          echo "Deploying $IMAGE"
          # imgURL tells an image-backed Render service exactly which image to deploy.
          curl -fsS -X POST -G --data-urlencode "imgURL=$IMAGE" "$RENDER_DEPLOY_HOOK_URL" -o /dev/null

      - name: Wait for /actuator/health to be UP
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL variable is not set; cannot verify the deploy."
            exit 0
          fi
          # Give Render time to start the new build before polling (the old instance stays UP meanwhile).
          sleep 60
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 10 "$BACKEND_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend is UP at $BACKEND_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$BACKEND_URL/actuator/health did not report UP within 15 minutes"
          exit 1

      - name: Smoke test GET /api/books
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' && env.BACKEND_URL != '' }}
        run: |
          status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$BACKEND_URL/api/books")
          echo "GET /api/books -> $status"
          test "$status" = "200"

      - name: Report the deployed QA URL
        id: deployed
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' && env.BACKEND_URL != '' }}
        run: echo "url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

  # After every deploy: the @qa acceptance scenarios against the deployed API, before manual QA starts.
  qa-acceptance:
    name: API acceptance on QA (Cucumber, @qa)
    needs: deploy-render
    if: ${{ needs.deploy-render.outputs.qa-url != '' }}
    uses: storyrail-squad/library-api-tests/.github/workflows/run-suite.yml@main # zizmor: ignore[unpinned-uses] same-org test suite, always latest
    with:
      base-url: ${{ needs.deploy-render.outputs.qa-url }}
      tags: "@qa and not @wip"
      report-name: api-acceptance-qa
