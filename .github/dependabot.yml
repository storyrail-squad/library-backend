version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Major upgrades are planned work (e.g. Spring Boot 4), not bot PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tests/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Java version is part of these image tags (3.9-eclipse-temurin-21, 21-jre-alpine), so
      # Dependabot sees Java 21 -> 26 as a minor bump. Java upgrades are planned work. The tags are
      # floating, so security patches still arrive on rebuild (plus `apk upgrade` and the Trivy gate).
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Major upgrades are planned work, not bot PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
