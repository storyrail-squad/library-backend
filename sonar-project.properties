# SonarCloud analysis. organization and projectKey are passed by .github/workflows/security.yml.
sonar.projectName=Library Catalog backend
sonar.sourceEncoding=UTF-8

sonar.sources=src/main/java
sonar.tests=src/test/java,tests/api
sonar.test.exclusions=**/node_modules/**,tests/api/playwright-report/**
sonar.coverage.exclusions=src/main/java/**/LibraryApplication.java
sonar.java.source=21
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports
